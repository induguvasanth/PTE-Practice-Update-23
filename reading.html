<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PTE General — Reading Practice</title>
<style>
:root{--bg:#f4f6fb;--surface:#fff;--soft:#f8f9fd;--ink:#152033;--muted:#697386;--line:#e3e7ee;--brand:#5637e8;--brand2:#8138eb;--green:#139a6b;--red:#d94b5b;--gold:#a96e00;--shadow:0 18px 55px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(91,61,245,.09),transparent 30%),radial-gradient(circle at 92% 5%,rgba(139,63,252,.07),transparent 28%),var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.appbar{height:74px;padding:0 28px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px}.brandmark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 24px rgba(91,61,245,.25)}
.btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:13px;padding:11px 16px;font-weight:850;font-size:12px;min-height:44px}.btn.primary{color:#fff;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(91,61,245,.18)}.btn.ghost{background:#f8f9fc}.btn:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:1800px;margin:auto;padding:22px 28px 30px}
.tabs{display:flex;align-items:stretch;gap:7px;padding:8px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 12px 35px rgba(15,23,42,.06);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:190px;border:0;background:transparent;border-radius:15px;padding:13px 15px;color:#596579;font-size:12px;font-weight:900;white-space:nowrap;transition:.18s}.tab:hover{background:#f5f3ff;color:var(--brand)}.tab.active{background:linear-gradient(135deg,#5637e8,#8138eb);color:#fff;box-shadow:0 9px 22px rgba(91,61,245,.22)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;margin-top:18px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.main-card{padding:28px}.side{display:grid;gap:16px;align-content:start}.side-card{padding:20px}
.exam-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#6f65c8}.exam-head h1{font-size:29px;line-height:1.1;margin:6px 0}.exam-head p{margin:0;color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#f7f8fa;border-radius:999px;color:#667085;font-size:11px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#98a2b3}
.task-strip{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{font-size:10px;font-weight:850;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fafbfc;color:#596579}
.qcount{font-size:11px;color:#697386;font-weight:900;margin:10px 0}
.instruction{padding:13px 15px;border:1px solid #f0d99d;background:#fffaf0;border-radius:14px;color:#715a22;font-size:12px;line-height:1.55;margin:12px 0}
.prompt{border:1px solid var(--line);background:#fbfcfe;border-radius:20px;padding:24px;font-size:17px;line-height:1.75;min-height:260px}.passage{white-space:pre-wrap}.prompt.compact{min-height:auto}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.controls .btn{min-width:118px}
.score-title{margin:0 0 5px;font-size:16px}.sub{font-size:12px;color:var(--muted);line-height:1.5}.score-panel{margin-top:14px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#f8f7ff,#eeecff);border:1px solid #ddd8ff}.score-label{font-size:11px;color:#697386}.score-big{font-size:36px;font-weight:950;color:#4934bd;margin-top:4px;letter-spacing:-.04em}.score-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.metrics{display:grid;gap:10px;margin-top:14px}.metric .row{display:flex;justify-content:space-between;font-size:11px;font-weight:850}.bar{height:7px;border-radius:99px;background:#e9ecf1;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.timer{font-size:40px;font-weight:950;color:#4732bd;letter-spacing:-.06em}.timer-state{font-size:12px;color:#697386;margin:7px 0 15px}.tips{margin:0;padding-left:18px;color:#667085}.tips li{font-size:12px;line-height:1.65;margin:5px 0}
.choice-grid{display:grid;gap:10px;margin-top:14px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;color:#344054;font-size:13px;font-weight:750;transition:.15s}.choice:hover{border-color:#b7aefa;background:#faf9ff}.choice.selected{border-color:#806df0;background:#f3f1ff;color:#4c36c5;box-shadow:0 0 0 3px rgba(91,61,245,.07)}.choice.correct{border-color:#76c9a9;background:#effbf6}.choice.wrong{border-color:#efa5ac;background:#fff4f4}
.blank-select{appearance:auto;border:1px solid #a79af8;border-radius:9px;padding:5px 8px;color:#4230b0;background:#fff;font-weight:800;min-width:115px;margin:0 3px}
.word-bank{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;padding:14px;border:1px dashed #c9c3f7;border-radius:16px;background:#faf9ff}.word{border:1px solid #d9d4ff;background:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850;color:#4934bd}.word.used{opacity:.4;pointer-events:none}.word.active{box-shadow:0 0 0 3px rgba(91,61,245,.12);border-color:#765ff0}
.blank-slot{display:inline-flex;align-items:center;justify-content:center;min-width:115px;border-bottom:2px solid #7e6ff0;padding:2px 7px;margin:0 2px;color:#4c36c5;font-weight:850;cursor:pointer;background:#f7f6ff;border-radius:7px 7px 0 0}.blank-slot.active{outline:3px solid rgba(91,61,245,.12)}
.reorder-list{display:grid;gap:10px;margin-top:14px}.reorder-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.reorder-num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#f0edff;color:#513acb;font-size:11px;font-weight:950}.reorder-text{font-size:13px;line-height:1.6}.move{display:flex;gap:5px}.move button{width:30px;height:30px;border:1px solid var(--line);background:#fafbfc;border-radius:9px;font-weight:900}
.solution-wrap{margin-top:14px}.solution-panel{margin-top:9px;padding:16px;border:1px solid #d8d2ff;background:#faf9ff;border-radius:15px}.solution-title{font-size:11px;font-weight:950;color:#5140b5;margin-bottom:7px}.solution-text{font-size:12px;line-height:1.75;white-space:pre-wrap}.blank-solution-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.blank-solution-controls .btn{min-width:150px}.template-panel{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:15px;background:#fbfcfe}.template-panel img{width:100%;max-height:390px;object-fit:contain;border-radius:10px}
.result-note{font-size:11px;color:#697386;margin-top:12px;line-height:1.55}
.loading{padding:40px;text-align:center;color:#667085}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.tabs .tab{min-width:210px}}
@media(max-width:720px){.appbar{height:62px;padding:0 14px}.shell{padding:12px 10px 24px}.brand{font-size:14px}.brandmark{width:38px;height:38px}.tabs{border-radius:17px}.tab{min-width:175px;padding:11px 12px}.layout{margin-top:12px}.main-card,.side-card{padding:16px;border-radius:19px}.exam-head h1{font-size:23px}.prompt{padding:17px;font-size:15px;min-height:230px}.side{grid-template-columns:1fr}.controls .btn{flex:1;min-width:0}.timer{font-size:34px}}

/* Premium question jump */
.question-jump{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #e3e7ef;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 8px 22px rgba(15,23,42,.04)}
.question-jump label{font-size:11px;font-weight:900;color:#64748b;white-space:nowrap}.question-jump input{width:82px;border:1px solid #d8deea;border-radius:10px;background:#fff;padding:8px 9px;font-weight:800;color:#334155;outline:none}.question-jump input:focus{border-color:#7c5ce6;box-shadow:0 0 0 3px rgba(124,92,230,.12)}.question-jump .go{border:0;border-radius:10px;padding:8px 11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#5637d8,#7846ed)}
@media(max-width:640px){.question-jump{width:100%;justify-content:space-between}.question-jump input{flex:1}}
.pte-wrong-answer{border:2px solid #d92d20!important;background:#fff0ee!important;color:#9f1d16!important}.pte-answer-error{background:#fff0ee;border:1px solid #f2a39d;color:#a12820;padding:12px 16px;border-radius:12px;margin:12px 0}.pte-answer-error ul{margin:8px 0 0;padding-left:20px}.pte-answer-error li{margin:4px 0}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><div class="brandmark">P</div><span>Reading</span></div>
  <a class="btn ghost" href="index.html" style="text-decoration:none">Dashboard</a>
</header>
<main class="shell">
  <nav class="tabs" aria-label="Reading tasks">
    <button class="tab" data-key="readingRWBlanks">🧩 R&W Fill in the Blanks</button>
    <button class="tab" data-key="readingMCQMultiple">☑️ Multiple Choice, Multiple Answers</button>
    <button class="tab" data-key="reorderParagraph">🔀 Re-order Paragraph</button>
    <button class="tab" data-key="readingBlanks">🧩 Fill in the Blanks</button>
    <button class="tab" data-key="readingMCQSingle">🔘 Multiple Choice, Single Answer</button>
  </nav>

  <div id="loading" class="card loading" style="margin-top:18px">Loading Reading practice…</div>

  <div id="app" class="layout hidden">
    <section class="card main-card">
      <div class="exam-head">
        <div>
          <div id="eyebrow" class="eyebrow">READING</div>
          <h1 id="title">Reading</h1>
          <p id="subtitle"></p>
        </div>
        <div class="status"><span class="dot"></span> <span id="statusText">Ready</span></div>
      </div>

      <div id="meta" class="task-strip"></div>
      <div id="qcount" class="qcount"></div>
      <div id="instruction" class="instruction"></div>
      <div id="content"></div>

      <div class="controls">
        <button id="prevBtn" class="btn">← Previous</button>
        <div class="question-jump"><label for="questionJump">Question</label><input id="questionJump" type="number" min="1" value="1" inputmode="numeric" aria-label="Enter question number"><button id="goQuestion" class="go">Go</button></div>
        <button id="nextBtn" class="btn">Next →</button>
        <button id="resetBtn" class="btn">Reset</button>
        <button id="finishBtn" class="btn primary">Finish & Score</button>
      </div>

      <div id="solutionWrap" class="solution-wrap"></div>
    </section>

    <aside class="side">
      <section class="card side-card">
        <h3 class="score-title">Practice result</h3>
        <div class="sub">Feedback appears after you finish the task.</div>
        <div class="score-panel">
          <div class="score-row">
            <div><div class="score-label">Practice score</div><div id="score" class="score-big">—</div></div>
            <button id="scoreSideBtn" class="btn primary">Score Task</button>
          </div>
          <div class="metrics">
            <div class="metric"><div class="row"><span>Accuracy</span><span id="accuracyValue">—</span></div><div class="bar"><i id="accuracyBar"></i></div></div>
            <div class="metric"><div class="row"><span>Completion</span><span id="completionValue">—</span></div><div class="bar"><i id="completionBar"></i></div></div>
          </div>
        </div>
        <div class="result-note">Practice estimate for learning and improvement. It is not an official Pearson score.</div>
      </section>

      <section class="card side-card">
        <h3 class="score-title">Exam controls</h3>
        <div id="timer" class="timer">00:00</div>
        <div id="timerState" class="timer-state">Ready</div>
        <div class="controls" style="margin-top:0">
          <button id="startBtn" class="btn primary">Start</button>
          <button id="stopBtn" class="btn">Stop</button>
        </div>
      </section>

      <section class="card side-card">
        <h3 class="score-title">Tips & tricks</h3>
        <ul id="tips" class="tips"></ul>
      </section>
    </aside>
  </div>
</main>

<script>

let DATA={},task='readingRWBlanks',idx=0,selected=[],blankAnswers=[],activeBlank=-1,order=[],startedAt=null,timerHandle=null;

function jsonp(action){
  return new Promise((resolve,reject)=>{
    const cb='pte_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const tm=setTimeout(()=>{script.remove();delete window[cb];reject(new Error('Backend timeout. Check the Apps Script URL and deployment.'))},16000);
    window[cb]=data=>{clearTimeout(tm);delete window[cb];script.remove();resolve(data)};
    script.src=API_URL+'?action='+encodeURIComponent(action)+'&callback='+cb+'&t='+Date.now();
    document.body.appendChild(script);
  });
}

async function init(){
  try{
    const d=await jsonp('reading');
    DATA=d.section||{};
    // The connected sheet may not yet contain the newly added multi-blank questions.
    // Use the bundled 30-question set until the connected section is updated to 30 or more items.
    if(!DATA.readingBlanks || !Array.isArray(DATA.readingBlanks.questions) || DATA.readingBlanks.questions.length<30){
      DATA.readingBlanks={...(DATA.readingBlanks||{}),questions:LOCAL_READING_BLANKS_FALLBACK};
    }
    $('loading').classList.add('hidden');$('app').classList.remove('hidden');
    selectTask(task);
  }catch(err){$('loading').textContent='Backend connection failed: '+err.message;}
}

function selectTask(key){
  task=key;idx=0;clearAttempt();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  const m=META[key];
  $('eyebrow').textContent=m.skills;$('title').textContent=m.icon+' '+m.label;$('subtitle').textContent=m.meta;
  $('instruction').textContent='💡 '+m.instruction;
  $('tips').innerHTML=m.tips.map(x=>'<li>'+esc(x)+'</li>').join('');
  resetResult();render();
}

function questions(){return (DATA[task]&&DATA[task].questions)||[]}
function current(){return questions()[idx]||null}

function clearAttempt(){selected=[];blankAnswers=[];activeBlank=-1;order=[];}
function resetResult(){
  $('score').textContent='—';$('accuracyValue').textContent='—';$('completionValue').textContent='—';
  $('accuracyBar').style.width='0';$('completionBar').style.width='0';
}

function render(){
  const arr=questions(),q=current();
  window.PTEProgress?.setContext('Reading',task,idx,q);
  if(window.PTEProgress)window.PTEProgress.refresh();
  $('qcount').textContent=q?'QUESTION '+(idx+1)+' OF '+arr.length:'';
  $('prevBtn').disabled=idx<=0;$('nextBtn').disabled=idx>=arr.length-1;
  if($('questionJump')){$('questionJump').min=1;$('questionJump').max=arr.length;$('questionJump').value=idx+1;}
  $('solutionWrap').innerHTML='';
  if(!q){
    $('content').innerHTML='<div class="prompt compact"><strong>No questions found for this task.</strong><br><span class="sub">Check the matching Google Sheet tab name and sample data.</span></div>';
    return;
  }
  if(task==='readingRWBlanks') renderDropdown(q);
  else if(task==='readingMCQMultiple') renderChoices(q,true);
  else if(task==='reorderParagraph') renderReorder(q);
  else if(task==='readingBlanks') renderWordBank(q);
  else renderChoices(q,false);
}

function questionText(q){return String(q.text||q.question||q.prompt||'').trim()}
function optionList(q){
  if(Array.isArray(q.options)&&q.options.length)return q.options.map(x=>String(x).trim()).filter(Boolean);
  if(typeof q.options==='string'&&q.options.trim())return q.options.split('|').map(x=>x.trim()).filter(Boolean);
  return [];
}

// R&W Fill in the Blanks can store a separate option set for every blank like:
// continue|refuse|forget|avoid ; such|same|much|few ; these|those|some|any ; accessing|removing|closing|forgetting
// The backend may already split the pipe-separated values into an array, leaving the semicolon
// attached to neighbouring items. Re-joining and splitting by semicolon restores the intended groups.
function blankOptionGroups(q,count){
  if(Array.isArray(q.optionGroups)&&q.optionGroups.length){
    const nested=q.optionGroups.map(g=>Array.isArray(g)?g:String(g||'').split('|'))
      .map(g=>g.map(x=>String(x).trim()).filter(Boolean));
    if(nested.length>=count)return nested;
  }
  const flat=optionList(q);
  if(!flat.length)return Array.from({length:count},()=>[]);
  const joined=flat.join('|');
  if(joined.includes(';')){
    const groups=joined.split(/\s*;\s*/).map(part=>part.split('|').map(x=>x.trim()).filter(Boolean));
    if(groups.length>=count)return groups.slice(0,count);
  }
  // Safe fallback for sheet rows that were flattened without semicolons: if options divide
  // evenly across blanks (e.g. 16 options for 4 blanks), give each blank only its own chunk.
  if(count>1 && flat.length%count===0){
    const size=flat.length/count;
    if(size>=2 && size<=8)return Array.from({length:count},(_,i)=>flat.slice(i*size,(i+1)*size));
  }
  // Legacy questions may intentionally share one common option bank across every blank.
  return Array.from({length:count},()=>flat);
}
function splitAnswer(ans){return String(ans||'').split(/\s*(?:\|\|\||\||;|,)\s*/).map(x=>x.trim()).filter(Boolean)}

function makeBlankPassage(text,renderer){
  let n=0;
  return esc(text).replace(/(\[\[blank(?:\d+)?\]\]|\{\{blank(?:\d+)?\}\}|_{3,})/gi,()=>{
    const i=n++; return renderer(i);

ories నుంచి gases బయటకు వస్తాయి కాబట్టి “release” సరైన verb.\n\nBlank 4: “control” — “Control pollution levels” అంటే కాలుష్య స్థాయులను నియంత్రించడం. Governments కాలుష్యాన్ని తగ్గించేందుకు చర్యలు తీసుకోవాలి కాబట్టి “control” సరైనది.","Students should [[blank]] regularly for exams and [[blank]] their notes. They should also [[blank]] enough sleep to [[blank]] concentration.":"Blank 1: “study” — “Study regularly for exams” అంటే పరీక్షల కోసం క్రమం తప్పకుండా చదవడం. “Study” ఇక్కడ action verbగా సరైనది.\n\nBlank 2: “review” — “Review their notes” అంటే notesని మళ్లీ చూసి పునశ్చరణ చేయడం. Exams ముందు information గుర్తుండేందుకు review చేయడం ఉపయోగపడుతుంది.\n\nBlank 3: “get” — “Get enough sleep” అనేది natural English phrase. Sleep కోసం “get” వాడతాం; “take sleep” సాధారణ usage కాదు.\n\nBlank 4: “improve” — “Improve concentration” అంటే ఏకాగ్రతను మెరుగుపరచడం. సరిపడా నిద్ర వల్ల focus మెరుగవుతుందని sentenceలోని logicకి ఇది సరిపోతుంది.","Recycling helps [[blank]] waste and [[blank]] natural resources. People can [[blank]] paper, glass, and plastic. This can [[blank]] the environment.":"Blank 1: “reduce” — “Reduce waste” అంటే చెత్త లేదా వృథా పదార్థాల పరిమాణాన్ని తగ్గించడం. Recycling ఈ ప్రయోజనాన్ని ఇస్తుంది కాబట్టి “reduce” సరైనది.\n\nBlank 2: “save” — “Save natural resources” అంటే సహజ వనరులను వృథా కాకుండా కాపాడటం. Recycling కొత్త raw materials అవసరాన్ని తగ్గించగలదు.\n\nBlank 3: “recycle” — “Recycle paper, glass, and plastic” అంటే ఈ పదార్థాలను మళ్లీ process చేసి ఉపయోగించడం. ఇక్కడ మూడు recyclable materials జాబితా ఉన్నందున “recycle” సరైనది.\n\nBlank 4: “protect” — “Protect the environment” అనేది common phrase. Recycling పర్యావరణానికి హాని తగ్గించడంలో సహాయపడుతుంది కాబట్టి “protect” సరైన verb.","A good teacher should [[blank]] lessons clearly and [[blank]] students to participate. Teachers can also [[blank]] feedback to help students [[blank]].":"Blank 1: “explain” — “Explain lessons clearly” అంటే పాఠాలను స్పష్టంగా వివరించడం. Teacher చేసే ప్రధాన పనిని సూచించడానికి “explain” సరైన verb.\n\nBlank 2: “encourage” — “Encourage students to participate” అంటే విద్యార్థులను పాల్గొనమని ప్రోత్సహించడం. “Encourage someone to do something” అనేది సరైన grammar pattern.\n\nBlank 3: “provide” — “Provide feedback” అనేది common collocation; అంటే feedback ఇవ్వడం. Teacher studentsకి సూచనలు, అభిప్రాయాలు అందిస్తారు కాబట్టి “provide” సరైనది.\n\nBlank 4: “improve” — “Help students improve” అనే structureలో “help” తర్వాత base verb “improve” వస్తుంది. Feedback వల్ల performance మెరుగవుతుందని sentence చెబుతోంది.","Many people [[blank]] money for future needs. Saving can [[blank]] financial stress and [[blank]] people during emergencies. It is important to [[blank]] a budget.":"Blank 1: “save” — “Save money for future needs” అంటే భవిష్యత్తులో అవసరాల కోసం డబ్బు దాచుకోవడం. Personal finance contextలో “save” సరైన verb.\n\nBlank 2: “reduce” — “Reduce financial stress” అంటే డబ్బుకు సంబంధించిన ఒత్తిడిని తగ్గించడం. Savings ఉండటం వల్ల unexpected expensesని ఎదుర్కోవడం సులభమవుతుంది.\n\nBlank 3: “help” — “Help people during emergencies” అంటే అత్యవసర పరిస్థితుల్లో ప్రజలకు ఉపయోగపడటం. “Help” తర్వాత person/object నేరుగా రావచ్చు కాబట్టి grammar కూడా సరైనది.\n\nBlank 4: “follow” — “Follow a budget” అంటే ముందుగా నిర్ణయించిన ఖర్చుల ప్రణాళికను పాటించడం. Budget ఒక plan కాబట్టి “follow” సరైన collocation.","Public parks provide places where people can [[blank]], relax, and [[blank]] time with family. Green spaces can also [[blank]] air quality and [[blank]] cities more attractive.":"Blank 1: “exercise” — “Exercise” అంటే శారీరక వ్యాయామం చేయడం. Parksలో నడవడం, పరుగెత్తడం వంటి activities చేయవచ్చు కాబట్టి ఇది సరైన verb.\n\nBlank 2: “spend” — “Spend time with family” అనేది fixed phrase. “Spend” సమయం ఎలా ఉపయోగిస్తున్నామో చెప్పడానికి వాడతాం.\n\nBlank 3: “improve” — “Improve air quality” అంటే గాలి నాణ్యతను మెరుగుపరచడం. Green spaces నగర వాతావరణానికి మేలు చేస్తాయని contextకి “improve” సరిపోతుంది.\n\nBlank 4: “make” — “Make cities more attractive” అంటే నగరాలను మరింత అందంగా లేదా ఆకర్షణీయంగా చేయడం. “Make + object + adjective” అనే grammar structure ఇక్కడ వాడబడింది.","Employees should [[blank]] on time and [[blank]] their tasks responsibly. They should also [[blank]] with colleagues and [[blank]] company rules.":"Blank 1: “arrive” — “Arrive on time” అంటే సమయానికి చేరుకోవడం. “On time” అనేది punctualityని తెలిపే phrase కాబట్టి “arrive” సరైనది.\n\nBlank 2: “complete” — “Complete tasks responsibly” అంటే పనులను బాధ్యతగా పూర్తి చేయడం. Employees తమ పనులు పూర్తిచేయాలి కాబట్టి “complete” meaningకి సరిపోతుంది.\n\nBlank 3: “cooperate” — “Cooperate with colleagues” అంటే సహోద్యోగులతో కలిసి పనిచేయడం. “Cooperate with” అనేది సరైన verb-preposition combination.\n\nBlank 4: “follow” — “Follow company rules” అంటే సంస్థ నియమాలను పాటించడం. Rulesకి సాధారణంగా “follow” వాడతాం; “break rules” అయితే విరుద్ధ అర్థం.","Learning a foreign language can [[blank]] communication skills and [[blank]] job opportunities. It also helps people [[blank]] different cultures and [[blank]] more confidently.":"Blank 1: “improve” — “Improve communication skills” అంటే సంభాషణ నైపుణ్యాలను మెరుగుపరచడం. Foreign language నేర్చుకోవడం మాట్లాడటం, అర్థం చేసుకోవడం మెరుగుపరుస్తుంది.\n\nBlank 2: “increase” — “Increase job opportunities” అంటే ఉద్యోగ అవకాశాలను పెంచడం. Language skills ఎక్కువ jobsకి అర్హత కల్పించవచ్చు కాబట్టి “increase” సరైనది.\n\nBlank 3: “understand” — “Understand different cultures” అంటే వేర్వేరు సంస్కృతులను అర్థం చేసుకోవడం. Language ద్వారా ఇతరుల customs, ideas గురించి తెలుసుకోవచ్చు.\n\nBlank 4: “communicate” — “Communicate confidently” అంటే నమ్మకంగా సంభాషించడం. “Confidently” అనే adverb communicate చేసే విధానాన్ని వివరిస్తుంది.","Fast food is often [[blank]] and convenient, but it may contain too much salt and fat. Eating it too often can [[blank]] health problems. People should [[blank]] healthier meals and [[blank]] fast food intake.":"Blank 1: “cheap” — “Cheap and convenient” అంటే తక్కువ ఖర్చుతో, సులభంగా అందుబాటులో ఉండటం. Fast food గురించి సాధారణంగా చెప్పే లక్షణాలకు “cheap” సరిపోతుంది.\n\nBlank 2: “cause” — “Cause health problems” అంటే ఆరోగ్య సమస్యలకు కారణమవడం. Too much salt and fat ఉన్న foodని తరచుగా తినడం వల్ల problems రావచ్చని sentence చెబుతోంది.\n\nBlank 3: “choose” — “Choose healthier meals” అంటే మరింత ఆరోగ్యకరమైన భోజనాన్ని ఎంచుకోవడం. Advice ఇస్తున్న sentenceలో “choose” సరైన action verb.\n\nBlank 4: “limit” — “Limit fast food intake” అంటే fast food తినే పరిమాణం లేదా frequencyని తగ్గించడం. “Limit” తర్వాత noun “intake” రావడం సరైన structure.","Libraries allow people to [[blank]] books and [[blank]] information. They also provide quiet areas where students can [[blank]]. Modern libraries may also [[blank]] internet access.":"Blank 1: “borrow” — “Borrow books” అంటే library నుంచి పుస్తకాలను తీసుకుని తర్వాత తిరిగి ఇవ్వడం. Library contextలో “borrow” సరైన verb; “buy” అంటే కొనడం అవుతుంది.\n\nBlank 2: “find” — “Find information” అంటే అవసరమైన సమాచారాన్ని కనుగొనడం. Librariesలో books, reference materials ద్వారా information పొందవచ్చు.\n\nBlank 3: “study” — “Students can study” అనే phraseలో “can” తర్వాత base verb “study” వస్తుంది. Quiet areas చదవడానికి ఉపయోగపడతాయని meaningకి ఇది సరిపోతుంది.\n\nBlank 4: “provide” — “Provide internet access” అంటే internet ఉపయోగించే అవకాశం కల్పించడం. Libraries ఈ సదుపాయాన్ని అందించవచ్చని sentence చెబుతోంది.","Good sleep helps the brain [[blank]] properly and [[blank]] concentration. People who sleep well usually [[blank]] more energetic and can [[blank]] better decisions.":"Blank 1: “function” — “Function properly” అంటే మెదడు సరిగ్గా పనిచేయడం. Good sleep brain functionకి అవసరమని చెప్పడానికి “function” సరైన verb.\n\nBlank 2: “improve” — “Improve concentration” అంటే ఏకాగ్రతను పెంచడం. Sleep బాగుంటే పగటిపూట focus మెరుగవుతుందని sentenceలోని meaning.\n\nBlank 3: “feel” — “Feel more energetic” అంటే మరింత ఉత్సాహంగా లేదా శక్తివంతంగా అనిపించడం. “Feel” తర్వాత adjective “energetic” రావడం సరైన grammar.\n\nBlank 4: “make” — “Make better decisions” అనేది fixed collocation. Englishలో decisions కోసం సాధారణంగా “make” వాడతాం, “do decisions” కాదు.","Governments should [[blank]] public safety and [[blank]] essential services. They also need to [[blank]] money carefully and [[blank]] long-term plans.":"Blank 1: “protect” — “Protect public safety” అంటే ప్రజల భద్రతను కాపాడడం. Government బాధ్యతల్లో safetyని కాపాడటం ఒకటి కాబట్టి “protect” సరైనది.\n\nBlank 2: “provide” — “Provide essential services” అంటే అవసరమైన సేవలను అందించడం. Health, transport, emergency services వంటి వాటిని governments అందిస్తాయి.\n\nBlank 3: “spend” — “Spend money carefully” అంటే డబ్బును ఆలోచించి ఖర్చు చేయడం. “Spend” moneyతో వాడే సరైన verb; “carefully” spending చేసే విధానాన్ని వివరిస్తుంది.\n\nBlank 4: “develop” — “Develop long-term plans” అంటే దీర్ఘకాలిక ప్రణాళికలను రూపొందించడం. Future needs కోసం plans తయారు చేయడానికి “develop” సరైనది.","Students can [[blank]] better results when they [[blank]] a study schedule. They should [[blank]] distractions and [[blank]] regular breaks.":"Blank 1: “achieve” — “Achieve better results” అంటే మెరుగైన ఫలితాలు సాధించడం. “Achieve” goals, results, success వంటి వాటితో సాధారణంగా వాడే verb.\n\nBlank 2: “follow” — “Follow a study schedule” అంటే చదువు timetableని పాటించడం. Schedule ఒక plan కాబట్టి “follow” సరైన collocation.\n\nBlank 3: “avoid” — “Avoid distractions” అంటే దృష్టి మరల్చే విషయాలను దూరంగా ఉంచడం. Better results కోసం distractions తగ్గించుకోవాలని sentence సూచిస్తోంది.\n\nBlank 4: “take” — “Take regular breaks” అనేది fixed English phrase. “Take a break” అంటే కొద్దిసేపు విశ్రాంతి తీసుకోవడం.","Exercise can [[blank]] the heart and [[blank]] body weight. It may also [[blank]] stress and [[blank]] mood.":"Blank 1: “strengthen” — “Strengthen the heart” అంటే గుండెను బలపరచడం. Exercise గుండె ఆరోగ్యానికి మేలు చేస్తుంది కాబట్టి “strengthen” సరైనది.\n\nBlank 2: “control” — “Control body weight” అంటే శరీర బరువును నియంత్రించడం. Fitness contextలో weightని manage చేయడాన్ని “control” అంటారు.\n\nBlank 3: “reduce” — “Reduce stress” అంటే ఒత్తిడిని తగ్గించడం. Exercise వల్ల mood, relaxation మెరుగవుతాయి కాబట్టి ఈ phrase meaningకి సరిపోతుంది.\n\nBlank 4: “improve” — “Improve mood” అంటే మనోభావాన్ని మెరుగుపరచడం. “Mood”ని మెరుగుపరచడానికి “improve” అనే verb సహజంగా వాడతాం.","The internet allows people to [[blank]] information quickly and [[blank]] with others. However, users should [[blank]] false information and [[blank]] reliable sources.":"Blank 1: “access” — “Access information” అంటే సమాచారాన్ని పొందడం లేదా ఉపయోగించగలగడం. Internet ద్వారా informationకి చేరుకోవచ్చని sentence చెబుతోంది.\n\nBlank 2: “communicate” — “Communicate with others” అంటే ఇతరులతో సంభాషించడం. “Communicate with” అనేది సరైన phrase; internet communicationని సులభం చేస్తుంది.\n\nBlank 3: “avoid” — “Avoid false information” అంటే తప్పు సమాచారాన్ని దూరంగా ఉంచడం లేదా నమ్మకపోవడం. Onlineలో misinformation ఉండవచ్చు కాబట్టి “avoid” సరైనది.\n\nBlank 4: “choose” — “Choose reliable sources” అంటే నమ్మదగిన సమాచార వనరులను ఎంచుకోవడం. False informationని నివారించడానికి trusted sourcesని ఎంచుకోవాలని sentence సూచిస్తోంది.","Climate change may [[blank]] temperatures and [[blank]] extreme weather. Governments can [[blank]] emissions and [[blank]] renewable energy.":"Blank 1: “increase” — “Increase temperatures” అంటే ఉష్ణోగ్రతలను పెంచడం. Climate change వల్ల global temperatures పెరగవచ్చనే meaningకి “increase” సరిపోతుంది.\n\nBlank 2: “cause” — “Cause extreme weather” అంటే తీవ్రమైన వాతావరణ పరిస్థితులకు కారణమవడం. “Cause” ఒక ప్రభావం లేదా సమస్య ఏర్పడటాన్ని సూచిస్తుంది.\n\nBlank 3: “reduce” — “Reduce emissions” అంటే కాలుష్య వాయువుల విడుదలను తగ్గించడం. Climate actionలో emissions తగ్గించడం ముఖ్యమైన చర్య కాబట్టి “reduce” సరైనది.\n\nBlank 4: “support” — “Support renewable energy” అంటే సౌర, గాలి వంటి పునరుత్పాదక శక్తిని ప్రోత్సహించడం లేదా దానికి మద్దతు ఇవ్వడం. “Support” ఈ contextలో సరైన verb.","Teamwork allows people to [[blank]] ideas and [[blank]] responsibilities. Team members should [[blank]] clearly and [[blank]] each other.":"Blank 1: “share” — “Share ideas” అంటే ఆలోచనలను ఒకరితో ఒకరు పంచుకోవడం. Teamworkలో members తమ suggestionsని పంచుకుంటారు కాబట్టి “share” సరైనది.\n\nBlank 2: “divide” — “Divide responsibilities” అంటే పనులు లేదా బాధ్యతలను సభ్యుల మధ్య పంచడం. Teamలో ప్రతి ఒక్కరికీ వేర్వేరు duties కేటాయిస్తారు.\n\nBlank 3: “communicate” — “Communicate clearly” అంటే స్పష్టంగా మాట్లాడటం లేదా సమాచారం ఇవ్వడం. Team members మధ్య confusion రాకుండా communication అవసరం.\n\nBlank 4: “support” — “Support each other” అంటే ఒకరికి ఒకరు సహాయం చేయడం. “Each other” పరస్పర చర్యను సూచిస్తుంది కాబట్టి “support” సరైనది.","People should [[blank]] traffic rules and [[blank]] carefully. Drivers need to [[blank]] attention and [[blank]] accidents whenever possible.":"Blank 1: “follow” — “Follow traffic rules” అంటే ట్రాఫిక్ నియమాలను పాటించడం. Road safety కోసం rulesని obey చేయాలి కాబట్టి “follow” సరైన verb.\n\nBlank 2: “drive” — “Drive carefully” అంటే జాగ్రత్తగా వాహనం నడపడం. “Carefully” అనే adverb driving ఎలా చేయాలో వివరిస్తుంది.\n\nBlank 3: “pay” — “Pay attention” అనేది fixed phrase; అంటే దృష్టి పెట్టడం. Englishలో “pay” attentionతో కలుస్తుంది, “give attention” ఇక్కడ సాధారణ collocation కాదు.\n\nBlank 4: “prevent” — “Prevent accidents” అంటే ప్రమాదాలు జరగకుండా అడ్డుకోవడం. Careful driving ప్రమాదాల అవకాశాన్ని తగ్గిస్తుంది కాబట్టి “prevent” సరైనది.","University students often [[blank]] many assignments and exams. They need to [[blank]] their time, [[blank]] important tasks, and [[blank]] stress effectively.":"Blank 1: “have” — “Have many assignments and exams” అంటే విద్యార్థులకు చాలా assignments, exams ఉండటం. “Have” ఇక్కడ workload ఉందని తెలిపే verb.\n\nBlank 2: “manage” — “Manage their time” అంటే సమయాన్ని ప్లాన్ చేసి సరిగ్గా ఉపయోగించడం. University workloadను ఎదుర్కోవడానికి time management అవసరం.\n\nBlank 3: “prioritize” — “Prioritize important tasks” అంటే ముఖ్యమైన పనులకు ముందుగా ప్రాధాన్యత ఇవ్వడం. “Prioritize” అంటే ఏ పని ముందు చేయాలో నిర్ణయించడం.\n\nBlank 4: “control” — “Control stress effectively” అంటే ఒత్తిడిని సమర్థవంతంగా నియంత్రించడం. “Control” stressతో సహజంగా వాడే verb; “effectively” ఆ చర్య ఎంత బాగా జరుగుతుందో వివరిస్తుంది."},"readingMCQMultiple":{"A university study found that students who regularly reviewed material over several weeks remembered more information than students who studied everything the night before an examination. The researchers concluded that repeated exposure over time supports long-term retention. Which statements are supported by the passage?":"సరైన option 1: “Regular review can support long-term retention”. Passageలో “The researchers concluded that repeated exposure over time supports long-term retention.” అని ఉంది. ఈ వాక్యం ఈ optionలోని భావానికి ఆధారం ఇస్తోంది; అందుకే దీన్ని ఎంచుకోవాలి.\n\nOption 2 — “Studying everything in one night was found to be less effective” సరైనది. Passageలోని “A university study found that students who regularly reviewed material over several weeks remembered more information than students who studied everything the night before an examination.” అనే సమాచారం దీనిని support చేస్తుంది. ఇది passageలో చెప్పిన విషయాన్ని సరైన రీతిలో paraphrase చేస్తోంది.\n\nమిగతా optionsను ఎంచుకునే ముందు passageలో వాటికి స్పష్టమైన ఆధారం ఉందో చూడండి. Passageలో లేని అతిశయోక్తి లేదా విరుద్ధమైన claimsను select చేయకండి.","Cities are increasingly investing in public transport to reduce traffic congestion and improve access to employment and education. However, the effectiveness of these systems depends on reliable services and convenient connections. Which statements are supported by the passage?":"సరైన option 1: “Public transport can improve access to opportunities”. Passageలో “Cities are increasingly investing in public transport to reduce traffic congestion and improve access to employment and education.” అని ఉంది. ఈ వాక్యం ఈ optionలోని భావానికి ఆధారం ఇస్తోంది; అందుకే దీన్ని ఎంచుకోవాలి.\n\nOption 2 — “Reliable services affect system effectiveness” సరైనది. Passageలోని “However, the effectiveness of these systems depends on reliable services and convenient connections.” అనే సమాచారం దీనిని support చేస్తుంది. ఇది passageలో చెప్పిన విషయాన్ని సరైన రీతిలో paraphrase చేస్తోంది.\n\nమిగతా optionsను ఎంచుకునే ముందు passageలో వాటికి స్పష function getSolutionText(q){
  const value=q.solution??q.Solution??q.solutionText??q.solution_text??q.explanation??q.Explanation??'';
  const text=Array.isArray(value)?value.map(x=>String(x??'')).join('\n'):String(value??'').trim();
  const detailed=solutionLookup(q);
  // Prefer the embedded detailed explanation when the backend contains the old generic placeholder.
  const isGeneric=/grammar\s*(?:మరియు|and)\s*meaningకి సరిపోతుంది|sentenceని పూర్తిగా చదివి|why it fits/i.test(text);
  if(text&&!isGeneric)return text;
  if(detailed)return detailed;
  if(text)return text;
  const answers=splitAnswer(q.answer);
  if(!answers.length)return 'ఈ question కోసం detailed solution ఇంకా sheetలో add చేయలేదు.';
  return answers.map((word,i)=>'Blank '+(i+1)+': “'+word+'” — ఈ blankకి సరైన పదాన్ని ఎంచుకోవడానికి ముందు మొత్తం sentence చదవండి. ఆ పదం grammar, meaning, మరియు పక్కనున్న wordsతో సహజంగా కలుస్తుందో పరిశీలించండి.').join('\n\n');
}
function renderDropdown(q){
  const raw=questionText(q);
  const count=(raw.match(/(\[\[blank(?:\d+)?\]\]|\{\{blank(?:\d+)?\}\}|_{3,})/gi)||[]).length;
  if(blankAnswers.length!==count) blankAnswers=Array(count).fill('');
  const groups=blankOptionGroups(q,count);
  const passage=makeBlankPassage(raw,i=>{
    const opts=groups[i]||[];
    const options=['<option value="">Select</option>'].concat(opts.map(o=>'<option value="'+esc(o)+'" '+(blankAnswers[i]===o?'selected':'')+'>'+esc(o)+'</option>')).join('');
    return '<select class="blank-select" data-blank="'+i+'">'+options+'</select>';
  });
  const answers=splitAnswer(q.answer);
  const solutionHtml='<div class="solution-title">Correct Answers & Telugu-English Explanation</div><div class="solution-text"><strong>Correct answers:</strong> '+esc(answers.join(' | ')||'Not available')+'\n\n'+esc(getSolutionText(q))+'</div>';
  $('content').innerHTML='<div class="prompt"><div class="passage">'+passage+'</div></div><div class="blank-solution-controls"><button id="toggleBlankSolution" class="btn" type="button">💡 Show Solution</button></div><div id="blankSolutionPanel" class="solution-panel hidden">'+solutionHtml+'</div>';
  document.querySelectorAll('.blank-select').forEach(s=>s.onchange=()=>{blankAnswers[Number(s.dataset.blank)]=s.value;});
  $('toggleBlankSolution').onclick=()=>{
    const panel=$('blankSolutionPanel');
    panel.classList.toggle('hidden');
    $('toggleBlankSolution').textContent=panel.classList.contains('hidden')?'💡 Show Solution':'🙈 Hide Solution';
  };
}

function solutionPanelHtml(q, mode='standard'){
  const answers=answerKey(q);
  let answerLabel='Correct answer(s):';
  let answerText=answers.join(' | ')||'Not available';
  if(mode==='reorder'){
    answerLabel='Correct paragraph order:';
    answerText=answers.join(' → ')||'Not available';
  }
  return '<div class="blank-solution-controls"><button class="btn" type="button" data-toggle-solution>💡 Show Solution</button></div>'+
    '<div class="solution-panel hidden" data-solution-panel><div class="solution-title">Correct Answers & Telugu-English Explanation</div><div class="solution-text"><strong>'+esc(answerLabel)+'</strong> '+esc(answerText)+'\n\n'+esc(getSolutionText(q))+'</div></div>';
}
function wireSolutionToggle(root=document){
  root.querySelectorAll('[data-toggle-solution]').forEach(btn=>btn.onclick=()=>{
    const panel=btn.parentElement.nextElementSibling;
    if(!panel)return;
    panel.classList.toggle('hidden');
    btn.textContent=panel.classList.contains('hidden')?'💡 Show Solution':'🙈 Hide Solution';
  });
}

function renderChoices(q,multiple){
  const prompt=questionText(q),opts=optionList(q);
  let html='<div class="prompt compact"><div class="passage">'+esc(prompt)+'</div></div>';
  html+='<div class="choice-grid">'+opts.map((o,i)=>'<button class="choice '+(selected.includes(i)?'selected':'')+'" data-choice="'+i+'"><strong>'+(multiple?'☑':'◉')+'</strong> '+esc(o)+'</button>').join('')+'</div>';
  html+=solutionPanelHtml(q,'standard');
  $('content').innerHTML=html;
  wireSolutionToggle($('content'));
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
    const n=Number(b.dataset.choice);
    selected=multiple?(selected.includes(n)?selected.filter(x=>x!==n):[...selected,n]):[n];
    renderChoices(q,multiple);
  });
}

function reorderParts(q){
  const text=questionText(q);
  if(text.includes('|||'))return text.split('|||').map(x=>x.trim()).filter(Boolean);
  const opts=optionList(q);return opts.length?opts:[text];
}
function renderReorder(q){
  const parts=reorderParts(q);
  if(!order.length||order.length!==parts.length)order=parts.map((_,i)=>i);
  let html='<div class="prompt compact"><div class="sub">Arrange the paragraphs from first to last.</div><div class="reorder-list">'+order.map((orig,pos)=>'<div class="reorder-item"><div class="reorder-num">'+(pos+1)+'</div><div class="reorder-text">'+esc(parts[orig])+'</div><div class="move"><button data-up="'+pos+'" '+(pos===0?'disabled':'')+'>↑</button><button data-down="'+pos+'" '+(pos===order.length-1?'disabled':'')+'>↓</button></div></div>').join('')+'</div></div>';
  html+=solutionPanelHtml(q,'reorder');
  $('content').innerHTML=html;
  wireSolutionToggle($('content'));
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.up);[order[p-1],order[p]]=[order[p],order[p-1]];renderReorder(q)});
  document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.down);[order[p+1],order[p]]=[order[p],order[p+1]];renderReorder(q)});
}

function renderWordBank(q){
  const opts=optionList(q),raw=questionText(q);
  const count=(raw.match(/(\[\[blank(?:\d+)?\]\]|\{\{blank(?:\d+)?\}\}|_{3,})/gi)||[]).length;
  if(blankAnswers.length!==count)blankAnswers=Array(count).fill('');
  const passage=makeBlankPassage(raw,i=>'<span class="blank-slot '+(activeBlank===i?'active':'')+'" data-slot="'+i+'">'+esc(blankAnswers[i]||'Choose word')+'</span>');
  const used=blankAnswers.filter(Boolean);
  let html='<div class="prompt"><div class="passage">'+passage+'</div></div><div class="word-bank">'+opts.map((o,i)=>{
    const usedElsewhere=used.includes(o)&&blankAnswers[activeBlank]!==o;
    return '<button class="word '+(used.includes(o)?'used':'')+'" data-word="'+i+'" '+(usedElsewhere?'disabled':'')+'>'+esc(o)+'</button>';
  }).join('')+'</div>';
  html+=solutionPanelHtml(q,'standard');
  $('content').innerHTML=html;
  wireSolutionToggle($('content'));
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{activeBlank=Number(b.dataset.slot);renderWordBank(q)});
  document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{
    if(activeBlank<0){alert('Select a blank first.');return;}
    const word=opts[Number(b.dataset.word)];
    const usedInOtherBlank=blankAnswers.some((v,i)=>i!==activeBlank&&v===word);
    if(usedInOtherBlank){alert('Each word can be used only once.');return;}
    blankAnswers[activeBlank]=word;activeBlank=-1;renderWordBank(q);
  });
}

function answerKey(q){return splitAnswer(q.answer)}
function evaluate(){
  const q=current();if(!q)return;
  let accuracy=0,completion=0,response='';
  if(task==='readingRWBlanks'||task==='readingBlanks'){
    const key=answerKey(q); const total=Math.max(key.length,blankAnswers.length,1);
    completion=Math.round(blankAnswers.filter(Boolean).length/total*100);
    let right=0;for(let i=0;i<Math.min(key.length,blankAnswers.length);i++)if(normalize(key[i])===normalize(blankAnswers[i]))right++;
    accuracy=Math.round(right/total*100);response=blankAnswers.join(' | ');
  }else if(task==='reorderParagraph'){
    const key=answerKey(q);const expected=key.map(x=>Number(x)-1);
    const total=Math.max(expected.length,order.length,1);let right=0;
    for(let i=0;i<Math.min(expected.length,order.length);i++)if(expected[i]===order[i])right++;
    completion=100;accuracy=Math.round(right/total*100);response=order.map(x=>x+1).join(' | ');
  }else{
    const opts=optionList(q),key=answerKey(q);
    completion=selected.length?100:0;
    const chosen=selected.map(i=>normalize(opts[i]));
    const expected=key.map(normalize);
    if(expected.length){
      const right=chosen.filter(x=>expected.includes(x)).length;
      const wrong=chosen.filter(x=>!expected.includes(x)).length;
      accuracy=Math.max(0,Math.round((right/expected.length*100)-(wrong*20)));
      if(chosen.length===expected.length&&right===expected.length)accuracy=100;
    }else accuracy=selected.length?60:0;
    response=selected.map(i=>opts[i]).join(' | ');
  }
  const score=Math.round((accuracy*.8+completion*.2)*.9);
  $('score').textContent=score+'/90 · '+Math.round(score/90*100)+'%';
  $('accuracyValue').textContent=accuracy+'%';$('completionValue').textContent=completion+'%';
  $('accuracyBar').style.width=accuracy+'%';$('completionBar').style.width=completion+'%';
  $('statusText').textContent='Finished';
  showSolution(q);
  showIncorrectReadingAnswers(q);
  save(q,response,score);
  if(window.PTEProgress)window.PTEProgress.markScore(score);
}

function showIncorrectReadingAnswers(q){
  document.querySelectorAll('.pte-answer-error').forEach(e=>e.remove());
  document.querySelectorAll('.pte-wrong-answer').forEach(e=>e.classList.remove('pte-wrong-answer'));
  const key=answerKey(q),norm=x=>normalize(String(x||''));
  const errors=[];
  if(task==='readingRWBlanks'||task==='readingBlanks'){
    blankAnswers.forEach((answer,i)=>{
      if(norm(answer)!==norm(key[i])){
        errors.push('Blank '+(i+1)+': '+(answer||'Not answered')+' → '+(key[i]||'Answer unavailable'));
        const el=document.querySelector('[data-blank="'+i+'"], [data-slot="'+i+'"]');if(el)el.classList.add('pte-wrong-answer');
      }
    });
  }else if(task==='reorderParagraph'){
    const expected=key.map(x=>Number(x)-1);
    order.forEach((original,i)=>{if(original!==expected[i]){errors.push('Position '+(i+1)+': incorrect paragraph');const el=document.querySelectorAll('.reorder-item')[i];if(el)el.classList.add('pte-wrong-answer')}});
  }else{
    const opts=optionList(q),expected=key.map(norm);
    selected.forEach(i=>{if(!expected.includes(norm(opts[i]))){errors.push('Incorrect choice: '+opts[i]);const el=document.querySelector('[data-choice="'+i+'"]');if(el)el.classList.add('pte-wrong-answer')}});
  }
  if(errors.length){const div=document.createElement('div');div.className='pte-answer-error';div.setAttribute('role','status');div.innerHTML='<strong>Incorrect answers</strong><ul>'+errors.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';document.getElementById('solutionWrap').prepend(div)}
}
function showSolution(q){
  // R&W Fill in the Blanks has its own always-available Show/Hide Solution toggle below the passage.
  if(task==='readingRWBlanks')return;
  let html='<button id="showSolution" class="btn">💡 Show Solution</button><div id="solutionPanel" class="solution-panel hidden"><div class="solution-title">Solution / Answer</div><div class="solution-text">'+esc(q.answer||'No solution has been added yet.')+'</div></div>';
  if(q.templateImageUrl)html+='<button id="showTemplate" class="btn" style="margin-top:9px">🖼️ Show Template Image</button><div id="templatePanel" class="template-panel hidden"><img src="'+esc(q.templateImageUrl)+'" alt="Practice template"></div>';
  $('solutionWrap').innerHTML=html;
  $('showSolution').onclick=()=>{const p=$('solutionPanel');p.classList.toggle('hidden');$('showSolution').textContent=p.classList.contains('hidden')?'💡 Show Solution':'🙈 Hide Solution'};
  if($('showTemplate'))$('showTemplate').onclick=()=>{const p=$('templatePanel');p.classList.toggle('hidden');$('showTemplate').textContent=p.classList.contains('hidden')?'🖼️ Show Template Image':'🙈 Hide Template Image'};
}

function save(q,response,score){
 const u=window.PTEAuth?.session();if(!u)return;
 window.PTEAuth.request('write',{action:'saveResult',studentToken:u.studentToken,studentId:u.studentId,studentName:u.studentName,task:task,questionId:q.id,expectedText:q.answer||q.text||'',response:response,pteScore:score}).catch(e=>console.warn('Result save:',e.message));
}

function resetCurrent(){clearAttempt();resetResult();$('statusText').textContent='Ready';render();}
function move(delta){const arr=questions();const n=idx+delta;if(n>=0&&n<arr.length){idx=n;clearAttempt();resetResult();render();}}
function startTimer(){
  if(startedAt)return;
  startedAt=Date.now();$('timerState').textContent='In progress';$('statusText').textContent='In progress';
  timerHandle=setInterval(()=>{const s=Math.floor((Date.now()-startedAt)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);
}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;startedAt=null;$('timerState').textContent='Stopped';$('statusText').textContent='Ready';}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('resetBtn').onclick=resetCurrent;
$('goQuestion').onclick=()=>{const arr=questions(),entered=Math.trunc(Number($('questionJump').value)),n=entered-1;if(Number.isFinite(n)&&n>=0&&n<arr.length){idx=n;clearAttempt();resetResult();render();window.scrollTo({top:0,behavior:'smooth'});}else{alert('Enter a question number from 1 to '+arr.length);$('questionJump').focus();}};$('questionJump').onkeydown=e=>{if(e.key==='Enter')$('goQuestion').click();};
$('finishBtn').onclick=evaluate;$('scoreSideBtn').onclick=evaluate;$('startBtn').onclick=startTimer;$('stopBtn').onclick=stopTimer;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTask(b.dataset.key));
init();
</script>
